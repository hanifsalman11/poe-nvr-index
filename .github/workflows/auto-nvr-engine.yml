name: Autonomous PoE Camera NVR Storage & Switch Engine

on:
  schedule:
    - cron: '5 */6 * * *'
  workflow_dispatch:
    inputs:
      custom_camera:
        description: 'Optional Camera Model (e.g. Reolink Duo 3 PoE 16MP)'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  generate-nvr-calculators:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build NVR Calculators & Ping Search Engines
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          PAGES_PER_RUN: '3'
          CUSTOM_CAMERA: ${{ github.event.inputs.custom_camera || '' }}
        run: |
          python engine/nvr_builder.py

      - name: Commit & Push to Trigger GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ data/published_cameras.json
          if git diff --staged --quiet; then
            echo "No new NVR camera pages to commit."
          else
            git commit -m "chore(nvr): auto-publish new PoE camera NVR storage calculators"
            git push origin main
          fi
